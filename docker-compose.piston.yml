# Self-hosted Piston for MicroTrainer (engineer-man/piston)
#
# The published image is API-only: /api/v2/runtimes returns [] until you install packages.
# Runtimes persist under ./data/piston/packages (mounted to /piston/packages in the container).
#
# Start:
#   docker compose -f docker-compose.piston.yml up -d
#
# Install languages MicroTrainer expects (first time, 5–30+ min depending on network):
#   node scripts/install-piston-packages.js
#
# Backend .env:
#   PISTON_URL=http://127.0.0.1:2000/api/v2

services:
  piston:
    image: ghcr.io/engineer-man/piston:latest

    container_name: microtrainer-piston-1

    ports:
      - "2000:2000"

    restart: unless-stopped

    privileged: true

    volumes:
      - ./data/piston/packages:/piston/packages

    tmpfs:
      - /tmp:exec

volumes: {}