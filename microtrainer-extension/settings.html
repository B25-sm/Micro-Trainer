<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroTrainer Settings</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      color: #475569;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    .status {
      margin-top: 18px;
      border-radius: 12px;
      padding: 12px;
      background: #eff6ff;
      color: #1e3a8a;
      font-size: 14px;
    }

    .hint {
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>MicroTrainer Extension Settings</h1>
      <p>
        Connect this extension to the student's deployed MicroTrainer frontend.
        This keeps AI and Piston usage on the student's own Render deployment.
      </p>

      <label for="frontendUrl">Student MicroTrainer Frontend URL</label>
      <input
        id="frontendUrl"
        type="url"
        placeholder="https://your-microtrainer-frontend.onrender.com"
      >
      <p class="hint">
        Use the frontend URL from Render, not the backend or Piston URL.
      </p>

      <div class="actions">
        <button id="save">Save Connection</button>
        <button id="openApp" class="secondary">Open Fullscreen App</button>
        <button id="clear" class="secondary">Clear</button>
      </div>

      <div id="status" class="status">Loading current settings...</div>
    </section>
  </main>

  <script src="settings.js"></script>
</body>
</html>
