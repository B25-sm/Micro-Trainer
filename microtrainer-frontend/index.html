<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Prevent aggressive caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>MicroTrainer - Practice Technical Interviews</title>
    <meta name="theme-color" content="#0b1f4d" />
    <meta property="og:title" content="MicroTrainer - Practice. Progress. Grow Together." />
    <meta property="og:image" content="/microtrainer-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/microtrainer-logo.png" />
    
    <!-- Apply saved dark / read mode before React paints -->
    <script>
      (function () {
        try {
          var dark = localStorage.getItem("microtrainer_dark_mode") === "true";
          var read = localStorage.getItem("microtrainer_read_mode") === "true";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.classList.toggle("read-mode", read);
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
